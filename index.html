<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>PIZZA'S QUEEN - Escáner</title>

  <!-- LECTOR DE CÓDIGOS ZXING -->

  <script
    src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }


    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }


    h1 {
      margin-bottom: 8px;
    }


    p {
      color: #ccc;
    }


    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }


    #btnAbrir {
      background: white;
      color: black;
    }


    #btnDetener {
      background: #8b0000;
      color: white;
      display: none;
    }


    #video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
      display: none;
    }


    #estado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #292929;
      white-space: pre-line;
      word-break: break-word;
    }


    .codigo {
      margin-top: 20px;
      padding: 20px;
      background: #17351f;
      border: 1px solid #28663a;
      border-radius: 12px;
      display: none;
    }


    .codigoNumero {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
      word-break: break-all;
    }

  </style>

</head>

<body>

  <div class="contenedor">

```
<h1>📷 PIZZA'S QUEEN</h1>


<p>
  Escáner de código de barras
</p>


<button
  id="btnAbrir"
  type="button"
  onclick="abrirCamara()"
>
  📷 ABRIR CÁMARA
</button>


<button
  id="btnDetener"
  type="button"
  onclick="detenerCamara()"
>
  ⏹ DETENER CÁMARA
</button>


<video
  id="video"
  autoplay
  muted
  playsinline
></video>


<div id="estado">
  Esperando para iniciar la cámara...
</div>


<div
  id="resultado"
  class="codigo"
>

  <div>
    ✅ CÓDIGO DETECTADO
  </div>


  <div
    id="codigoNumero"
    class="codigoNumero"
  ></div>

</div>
```

  </div>

<script>


  var stream =
    null;


  var lector =
    null;


  var escaneando =
    false;


  var codigoAnterior =
    "";


  function mostrarEstado(
    texto
  ) {

    document
      .getElementById(
        "estado"
      )
      .textContent =
        texto;

  }


  async function abrirCamara() {

    try {


      /*
       * Limpiamos cualquier cámara
       * anterior.
       */

      detenerCamara();


      mostrarEstado(
        "📷 Solicitando permiso para utilizar la cámara..."
      );


      /*
       * Comprobamos que el navegador
       * tenga acceso a getUserMedia.
       */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mostrarEstado(
          "❌ Este navegador no permite utilizar la cámara."
        );

        return;

      }


      /*
       * ABRIMOS LA CÁMARA DIRECTAMENTE.
       *
       * Este método ya comprobamos que
       * funciona correctamente en GitHub Pages.
       */

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


      var video =
        document.getElementById(
          "video"
        );


      /*
       * Conectamos la cámara
       * al elemento de video.
       */

      video.srcObject =
        stream;


      video.muted =
        true;


      video.setAttribute(
        "playsinline",
        ""
      );


      video.style.display =
        "block";


      /*
       * Esperamos a que el video
       * comience realmente.
       */

      await video.play();


      /*
       * Mostramos controles.
       */

      document.getElementById(
        "btnAbrir"
      ).style.display =
        "none";


      document.getElementById(
        "btnDetener"
      ).style.display =
        "block";


      mostrarEstado(
        "✅ Cámara activada.\n\n" +
        "Apunta la cámara hacia un código de barras."
      );


      /*
       * Comprobamos que ZXing
       * se haya cargado.
       */

      if (
        typeof ZXing === "undefined"
      ) {

        mostrarEstado(
          "⚠️ La cámara funciona, pero no se pudo cargar ZXing."
        );

        return;

      }


      /*
       * Creamos el lector.
       */

      lector =
        new ZXing.MultiFormatReader();


      escaneando =
        true;


      /*
       * Comenzamos a analizar
       * la imagen del video.
       */

      escanearVideo(
        video
      );


    } catch (error) {

      console.error(
        "Error cámara:",
        error
      );


      mostrarEstado(

        "❌ NO SE PUDO ACCEDER A LA CÁMARA.\n\n" +

        "Nombre del error: " +
        (
          error.name ||
          "Error"
        ) +

        "\n\n" +

        "Mensaje: " +
        (
          error.message ||
          "Error desconocido"
        )

      );


      detenerCamara();

    }

  }


  function escanearVideo(
    video
  ) {


    if (
      !escaneando
    ) {

      return;

    }


    if (
      !lector
    ) {

      return;

    }


    /*
     * Creamos un canvas oculto.
     *
     * Cada fotograma de la cámara
     * será copiado al canvas.
     */

    var canvas =
      document.createElement(
        "canvas"
      );


    var contexto =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    function analizar() {


      if (
        !escaneando
      ) {

        return;

      }


      /*
       * Esperamos a que el video
       * tenga una imagen disponible.
       */

      if (
        video.readyState <
        2
      ) {

        requestAnimationFrame(
          analizar
        );

        return;

      }


      var ancho =
        video.videoWidth;


      var alto =
        video.videoHeight;


      if (
        !ancho ||
        !alto
      ) {

        requestAnimationFrame(
          analizar
        );

        return;

      }


      /*
       * Ajustamos el canvas
       * al tamaño real de la cámara.
       */

      canvas.width =
        ancho;


      canvas.height =
        alto;


      /*
       * Copiamos el fotograma.
       */

      contexto.drawImage(
        video,
        0,
        0,
        ancho,
        alto
      );


      try {


        /*
         * Obtenemos los píxeles.
         */

        var imagen =
          contexto.getImageData(
            0,
            0,
            ancho,
            alto
          );


        /*
         * Convertimos la imagen
         * para ZXing.
         */

        var fuente =
          new ZXing.RGBLuminanceSource(
            imagen.data,
            ancho,
            alto
          );


        var binario =
          new ZXing.BinaryBitmap(
            new ZXing.HybridBinarizer(
              fuente
            )
          );


        /*
         * Intentamos encontrar
         * un código.
         */

        var resultado =
          lector.decode(
            binario
          );


        if (
          resultado
        ) {


          var codigo =
            resultado.getText();


          if (
            codigo
          ) {


            codigo =
              String(
                codigo
              ).trim();


            /*
             * Evitamos detectar
             * repetidamente el mismo código.
             */

            if (
              codigo &&
              codigo !== codigoAnterior
            ) {


              codigoAnterior =
                codigo;


              /*
               * Mostramos el código.
               */

              mostrarCodigo(
                codigo
              );


              /*
               * Cerramos la cámara.
               */

              detenerCamara();


              return;

            }

          }

        }


      } catch (error) {

        /*
         * IMPORTANTE:
         *
         * ZXing lanza errores cuando
         * simplemente NO encuentra un
         * código en ese fotograma.
         *
         * Eso es completamente normal.
         */

      }


      /*
       * Continuamos analizando
       * el siguiente fotograma.
       */

      requestAnimationFrame(
        analizar
      );

    }


    analizar();

  }


  function mostrarCodigo(
    codigo
  ) {


    document
      .getElementById(
        "codigoNumero"
      )
      .textContent =
        codigo;


    document
      .getElementById(
        "resultado"
      )
      .style.display =
        "block";


    mostrarEstado(

      "✅ Código detectado correctamente.\n\n" +

      "Código: " +
      codigo +

      "\n\n" +

      "Regresando a PIZZA'S QUEEN..."

    );


    /*
     * Recuperamos la URL de regreso
     * enviada desde PIZZA'S QUEEN.
     */

    var parametros =
      new URLSearchParams(
        window.location.search
      );


    var urlRegreso =
      parametros.get(
        "return"
      );


    /*
     * Si la cámara fue abierta
     * directamente, no existe
     * URL de regreso.
     */

    if (
      !urlRegreso
    ) {

      return;

    }


    /*
     * Determinamos si la URL
     * ya tiene parámetros.
     */

    var separador =
      urlRegreso.indexOf("?") >= 0
        ? "&"
        : "?";


    /*
     * Agregamos el código detectado.
     */

    var destino =
      urlRegreso +
      separador +
      "codigo=" +
      encodeURIComponent(
        codigo
      );


    /*
     * Regresamos automáticamente
     * a PIZZA'S QUEEN.
     */

    setTimeout(
      function() {

        window.location.href =
          destino;

      },
      800
    );

  }


  function detenerCamara() {


    escaneando =
      false;


    /*
     * Cerramos todos los tracks
     * de la cámara.
     */

    if (
      stream
    ) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      stream =
        null;

    }


    /*
     * Limpiamos el video.
     */

    var video =
      document.getElementById(
        "video"
      );


    if (
      video
    ) {

      video.pause();


      video.srcObject =
        null;


      video.style.display =
        "none";

    }


    /*
     * Eliminamos el lector.
     */

    lector =
      null;


    /*
     * Restauramos botones.
     */

    var btnDetener =
      document.getElementById(
        "btnDetener"
      );


    var btnAbrir =
      document.getElementById(
        "btnAbrir"
      );


    if (
      btnDetener
    ) {

      btnDetener.style.display =
        "none";

    }


    if (
      btnAbrir
    ) {

      btnAbrir.style.display =
        "block";

    }

  }


</script>

</body>

</html>
