      escaneando =

      document.getElementById(
        "btnAbrir"
      ).style.display =
        "none";


      document.getElementById(
        "btnDetener"
      ).style.display =
        "block";


      document.getElementById(
        "video"
      ).style.display =
        "block";


      mostrarEstado(
        "📷 Cámara activándose...\n\n" +
        "Apunta hacia el código de barras."
      );


      lector.decodeFromConstraints(

        {

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        },

        "video",

        function(
          resultado,
          error
        ) {

          if (!escaneando) {

            return;

          }


          if (resultado) {

            var codigo =
              resultado.getText();


            if (!codigo) {

              return;

            }


            codigo =
              String(
                codigo
              ).trim();


            if (
              !codigo ||
              codigo === codigoAnterior
            ) {

              return;

            }


            codigoAnterior =
              codigo;


            mostrarCodigo(
              codigo
            );


            detenerCamara();

          }

        }

      );

    } catch (error) {

      console.error(
        "Error iniciando cámara:",
        error
      );


      mostrarEstado(

        "❌ NO SE PUDO INICIAR LA CÁMARA.\n\n" +

        "Nombre del error: " +
        (
          error.name ||
          "Error"
        ) +

        "\n\n" +

        "Mensaje: " +
        (
          error.message ||
          "No se pudo iniciar el lector."
        )

      );


      detenerCamara();

    }

  }


  function mostrarCodigo(
    codigo
  ) {

    document
      .getElementById(
        "codigoNumero"
      )
      .textContent =
        codigo;


    document
      .getElementById(
        "resultado"
      )
      .style.display =
        "block";


    mostrarEstado(

      "✅ Código detectado correctamente.\n\n" +

      "Código: " +
      codigo +

      "\n\n" +

      "Regresando a PIZZA'S QUEEN..."

    );


    var parametros =
      new URLSearchParams(
        window.location.search
      );


    var urlRegreso =
      parametros.get(
        "return"
      );


    if (!urlRegreso) {

      return;

    }


    var separador =
      urlRegreso.indexOf("?") >= 0
        ? "&"
        : "?";


    var destino =
      urlRegreso +
      separador +
      "codigo=" +
      encodeURIComponent(
        codigo
      );


    setTimeout(
      function() {

        window.location.href =
          destino;

      },
      800
    );

  }


  function detenerCamara() {

    escaneando =
      false;


    if (lector) {

      try {

        lector.reset();

      } catch (error) {

        console.log(
          "Error cerrando lector:",
          error
        );

      }

      lector =
        null;

    }


    var video =
      document.getElementById(
        "video"
      );


    if (video) {

      try {

        if (
          video.srcObject
        ) {

          video.srcObject
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );

        }

      } catch (error) {

        console.log(
          "Error cerrando cámara:",
          error
        );

      }


      video.pause();

      video.srcObject =
        null;

      video.style.display =
        "none";

    }


    document.getElementById(
      "btnDetener"
    ).style.display =
      "none";


    document.getElementById(
      "btnAbrir"
    ).style.display =
      "block";

  }

</script>
