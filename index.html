<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Prueba cámara PIZZA'S QUEEN</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #video {
      width: 100%;
      margin-top: 20px;
      background: black;
      border-radius: 12px;
    }

    #estado {
      margin-top: 20px;
      padding: 15px;
      background: #292929;
      border-radius: 10px;
      white-space: pre-line;
    }

  </style>

</head>

<body>

  <div class="contenedor">

```
<h1>📷 PIZZA'S QUEEN</h1>

<p>Prueba directa de cámara</p>

<button
  type="button"
  onclick="probarCamara()"
>
  📷 ABRIR CÁMARA
</button>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<div id="estado">
  Esperando...
</div>
```

  </div>

<script>

async function probarCamara() {

  var video =
    document.getElementById("video");

  var estado =
    document.getElementById("estado");

  try {

    estado.textContent =
      "📷 Solicitando cámara...";

    var stream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    video.srcObject =
      stream;


    video.muted =
      true;


    video.setAttribute(
      "playsinline",
      ""
    );


    await video.play();


    estado.textContent =
      "✅ CÁMARA ACTIVADA.\n\n" +
      "Si ves tu imagen arriba, GitHub Pages puede mostrar la cámara correctamente.";

  } catch (error) {

    estado.textContent =
      "❌ ERROR\n\n" +
      "Nombre: " +
      error.name +
      "\n\n" +
      "Mensaje: " +
      error.message;

    console.error(error);

  }

}

</script>

</body>

</html>
