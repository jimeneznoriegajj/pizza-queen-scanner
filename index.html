<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PIZZA'S QUEEN - Escáner</title>


  <!--
    LIBRERÍA ZXING PARA NAVEGADOR
    Esta es la versión especializada
    para lectura mediante cámara.
  -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      text-align: center;

    }


    .contenedor {

      width: 100%;

      max-width: 600px;

      margin: auto;

    }


    h1 {

      margin-bottom: 8px;

    }


    p {

      color: #ccc;

      line-height: 1.5;

    }


    button {

      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: none;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    #btnAbrir {

      background: white;

      color: black;

    }


    #btnDetener {

      background: #8b0000;

      color: white;

      display: none;

    }


    #video {

      width: 100%;

      max-height: 70vh;

      margin-top: 20px;

      border-radius: 12px;

      background: black;

      display: none;

      object-fit: cover;

    }


    #estado {

      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: #292929;

      white-space: pre-line;

      word-break: break-word;

      line-height: 1.5;

    }


    .codigo {

      margin-top: 20px;

      padding: 20px;

      background: #17351f;

      border: 1px solid #28663a;

      border-radius: 12px;

      display: none;

    }


    .codigoNumero {

      font-size: 26px;

      font-weight: bold;

      margin-top: 10px;

      word-break: break-all;

    }


    .marco {

      position: relative;

      width: 100%;

    }


    /*
     * Zona visual para ayudar a colocar
     * el código en el centro.
     */

    .guia {

      position: absolute;

      left: 8%;

      right: 8%;

      top: 40%;

      height: 20%;

      border: 2px solid white;

      border-radius: 8px;

      pointer-events: none;

      display: none;

    }


    .ayuda {

      margin-top: 12px;

      font-size: 14px;

      color: #aaa;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>
      📷 PIZZA'S QUEEN
    </h1>


    <p>
      Escáner de código de barras
    </p>


    <button
      id="btnAbrir"
      type="button"
      onclick="abrirCamara()"
    >
      📷 ABRIR CÁMARA
    </button>


    <button
      id="btnDetener"
      type="button"
      onclick="detenerCamara()"
    >
      ⏹ DETENER CÁMARA
    </button>


    <div class="marco">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div
        id="guia"
        class="guia"
      ></div>

    </div>


    <div
      id="estado"
    >
      Esperando para iniciar la cámara...
    </div>


    <div
      class="ayuda"
      id="ayuda"
      style="display:none;"
    >
      📦 Coloca el código de barras dentro del recuadro.
      <br>
      Mantén el celular quieto durante unos segundos.
    </div>


    <div
      id="resultado"
      class="codigo"
    >

      <div>
        ✅ CÓDIGO DETECTADO
      </div>


      <div
        id="codigoNumero"
        class="codigoNumero"
      ></div>

    </div>


  </div>



<script>


  /*
   * CONTROL DE ZXING
   */

  var controles =
    null;


  /*
   * Evita procesar múltiples veces
   * el mismo código.
   */

  var codigoDetectado =
    false;



  /*
   * Mostrar mensajes.
   */

  function mostrarEstado(
    texto
  ) {

    document
      .getElementById(
        "estado"
      )
      .textContent =
        texto;

  }



  /*
   * ABRIR CÁMARA
   */

  async function abrirCamara() {

    try {


      codigoDetectado =
        false;


      /*
       * Si ya existe una sesión
       * anterior, la detenemos.
       */

      detenerCamara();


      mostrarEstado(
        "📷 Iniciando cámara..."
      );


      /*
       * Verificamos que ZXing
       * esté disponible.
       */

      if (
        typeof ZXingBrowser === "undefined"
      ) {

        mostrarEstado(

          "❌ No se pudo cargar el lector de códigos.\n\n" +

          "Verifica tu conexión a Internet y vuelve a intentar."

        );

        return;

      }


      /*
       * Verificamos cámara del navegador.
       */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mostrarEstado(

          "❌ Este navegador no permite utilizar la cámara."

        );

        return;

      }


      var video =
        document.getElementById(
          "video"
        );


      /*
       * Mostramos el video.
       */

      video.style.display =
        "block";


      document.getElementById(
        "guia"
      ).style.display =
        "block";


      document.getElementById(
        "ayuda"
      ).style.display =
        "block";


      /*
       * Creamos el lector especializado
       * para navegador.
       */

      var lector =
        new ZXingBrowser.BrowserMultiFormatReader();


      /*
       * Configuración de cámara.
       *
       * environment = cámara trasera
       * cuando el dispositivo la tenga.
       */

      var restricciones = {

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };


      mostrarEstado(

        "📷 Solicitando permiso para utilizar la cámara..."

      );


      /*
       * Iniciamos el lector.
       *
       * ZXing se encarga de analizar
       * continuamente la imagen.
       */

      controles =
        await lector.decodeFromConstraints(

          restricciones,

          video,

          function(
            resultado,
            error
          ) {


            /*
             * Si ya encontramos un código,
             * ignoramos lecturas posteriores.
             */

            if (
              codigoDetectado
            ) {

              return;

            }


            /*
             * RESULTADO ENCONTRADO
             */

            if (
              resultado
            ) {


              try {


                var codigo =
                  resultado
                    .getText();


                if (
                  codigo
                ) {


                  codigo =
                    String(
                      codigo
                    ).trim();


                  if (
                    codigo
                  ) {


                    codigoDetectado =
                      true;


                    mostrarCodigo(
                      codigo
                    );


                    return;

                  }

                }


              } catch (
                errorLectura
              ) {

                console.error(
                  "Error obteniendo código:",
                  errorLectura
                );

              }

            }


            /*
             * Los errores de "no encontrado"
             * son normales mientras ZXing
             * analiza los fotogramas.
             */

          }

        );


      /*
       * Mostramos controles.
       */

      document.getElementById(
        "btnAbrir"
      ).style.display =
        "none";


      document.getElementById(
        "btnDetener"
      ).style.display =
        "block";


      mostrarEstado(

        "✅ CÁMARA ACTIVADA\n\n" +

        "Apunta hacia el código de barras.\n\n" +

        "⏳ Buscando código..."

      );


    } catch (
      error
    ) {


      console.error(
        "Error cámara:",
        error
      );


      mostrarEstado(

        "❌ NO SE PUDO INICIAR EL ESCÁNER.\n\n" +

        "Nombre del error: " +
        (
          error.name ||
          "Error"
        ) +

        "\n\n" +

        "Mensaje: " +
        (
          error.message ||
          "Error desconocido"
        )

      );


      detenerCamara();

    }

  }



  /*
   * MOSTRAR CÓDIGO
   */

  function mostrarCodigo(
    codigo
  ) {


    /*
     * Mostramos el código.
     */

    document
      .getElementById(
        "codigoNumero"
      )
      .textContent =
        codigo;


    document
      .getElementById(
        "resultado"
      )
      .style.display =
        "block";


    mostrarEstado(

      "✅ CÓDIGO DETECTADO CORRECTAMENTE.\n\n" +

      "Código: " +
      codigo +

      "\n\n" +

      "Regresando a PIZZA'S QUEEN..."

    );


    /*
     * Detenemos la cámara
     * después de encontrar el código.
     */

    detenerCamara();


    /*
     * Recuperamos la URL de regreso
     * enviada desde PIZZA'S QUEEN.
     */

    var parametros =
      new URLSearchParams(
        window.location.search
      );


    var urlRegreso =
      parametros.get(
        "return"
      );


    /*
     * Si abrimos GitHub directamente
     * no existe URL de regreso.
     */

    if (
      !urlRegreso
    ) {

      mostrarEstado(

        "✅ Código detectado correctamente.\n\n" +

        "Código: " +
        codigo

      );

      return;

    }


    /*
     * Determinamos si la URL ya
     * tiene parámetros.
     */

    var separador =
      urlRegreso.indexOf("?") >= 0
        ? "&"
        : "?";


    /*
     * Agregamos el código detectado.
     */

    var destino =
      urlRegreso +

      separador +

      "codigo=" +

      encodeURIComponent(
        codigo
      );


    /*
     * Regresamos automáticamente
     * a PIZZA'S QUEEN.
     */

    setTimeout(
      function() {

        window.location.href =
          destino;

      },
      800
    );

  }



  /*
   * DETENER CÁMARA
   */

  function detenerCamara() {


    /*
     * Detenemos ZXing.
     */

    if (
      controles
    ) {

      try {

        controles.stop();

      } catch (
        error
      ) {

        console.error(
          "Error deteniendo lector:",
          error
        );

      }


      controles =
        null;

    }


    /*
     * Detenemos cualquier
     * transmisión de cámara
     * que haya quedado activa.
     */

    var video =
      document.getElementById(
        "video"
      );


    if (
      video &&
      video.srcObject
    ) {


      try {

        video
          .srcObject
          .getTracks()
          .forEach(
            function(
              track
            ) {

              track.stop();

            }
          );

      } catch (
        error
      ) {

        console.error(
          "Error cerrando cámara:",
          error
        );

      }


      video.srcObject =
        null;

    }


    /*
     * Ocultamos video y guía.
     */

    if (
      video
    ) {

      video.style.display =
        "none";

    }


    var guia =
      document.getElementById(
        "guia"
      );


    if (
      guia
    ) {

      guia.style.display =
        "none";

    }


    document.getElementById(
      "ayuda"
    ).style.display =
      "none";


    /*
     * Restauramos botones.
     */

    var btnAbrir =
      document.getElementById(
        "btnAbrir"
      );


    var btnDetener =
      document.getElementById(
        "btnDetener"
      );


    if (
      btnAbrir
    ) {

      btnAbrir.style.display =
        "block";

    }


    if (
      btnDetener
    ) {

      btnDetener.style.display =
        "none";

    }

  }



  /*
   * LIMPIAR TODO AL CERRAR
   * O CAMBIAR DE PÁGINA.
   */

  window.addEventListener(
    "beforeunload",
    function() {

      detenerCamara();

    }
  );


</script>


</body>

</html>
